<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prepositions Quiz 1: Place, Time and Transport</title>
<style>
  :root{
    --board:#0D1B2A;
    --card:#15304A;
    --line:#2C5271;
    --line-soft:#1D3E58;
    --ink:#F1F5F9;
    --ink-dim:#9FB4C7;
    --blue:#4FA8E8;
    --purple:#B98BE8;
    --yellow:#F5C84C;
    --coral:#E8785A;
    --green:#59C48B;
    --opt-bg-correct:#1B4A34;
    --opt-bg-wrong:#4A2620;
  }
  html[data-theme="light"]{
    --board:#F4F8FC;
    --card:#FFFFFF;
    --line:#C7D9EA;
    --line-soft:#E3EEF8;
    --ink:#132A3D;
    --ink-dim:#54697C;
    --blue:#1C6FB0;
    --purple:#7A4FC4;
    --yellow:#B8860B;
    --coral:#C1503A;
    --green:#2F8F5B;
    --opt-bg-correct:#DFF5E7;
    --opt-bg-wrong:#FBE1DA;
  }
  *{box-sizing:border-box;}
  :root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  .pic-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:clamp(16px,3vw,44px); align-items:center; max-width:1200px; margin:0 auto;}
  .q-pic{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:clamp(6px,1vw,12px);}
  .q-pic svg{display:block; width:100%; height:auto; max-height:min(44vh,330px); margin:0 auto;}
  .pic-main .prompt{font-size:clamp(22px,3vw,42px); text-align:left; margin:0 0 clamp(14px,2.2vh,24px);}
  .pic-main .options{max-width:none; gap:clamp(10px,1.4vw,18px);}
  .pic-main .opt{font-size:clamp(18px,2.1vw,28px); padding:clamp(10px,1.6vh,18px) 12px;}
  @media (max-width:760px){ .pic-row{grid-template-columns:1fr;} .pic-main .prompt{text-align:center;} .q-pic svg{max-height:28vh;} }
  .svg-wrap{overflow-x:auto; max-width:100%;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--board);
    color:var(--ink);
    font-family:"Trebuchet MS","Verdana",sans-serif;
    overflow:hidden;
  }
  body{
    background-image:
      radial-gradient(circle at 12% 15%, rgba(79,168,232,0.06) 0, transparent 40%),
      radial-gradient(circle at 88% 85%, rgba(79,168,232,0.05) 0, transparent 45%);
  }
  .wrap{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:max(76px, clamp(16px,3vh,40px)) clamp(24px,5vw,80px) clamp(16px,3vh,40px);
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .section-tag{
    font-size:clamp(15px,1.9vw,24px);
    letter-spacing:0.03em;
    color:var(--blue);
    font-weight:bold;
    border:2px solid var(--blue);
    border-radius:999px;
    padding:6px 20px;
    white-space:nowrap;
  }
  .score-chip{
    font-size:clamp(14px,1.7vw,22px);
    font-weight:bold;
    border-radius:999px;
    padding:6px 18px;
    white-space:nowrap;
  }
  .score-chip.solo{color:var(--yellow); border:2px solid var(--yellow);}
  .score-chip.a{color:var(--blue); border:2px solid var(--blue);}
  .score-chip.b{color:var(--purple); border:2px solid var(--purple);}
  .score-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .progress{
    flex:1;
    min-width:100px;
    margin:0 8px;
    display:flex;
    gap:6px;
  }
  .dot{
    flex:1;
    height:8px;
    border-radius:4px;
    background:var(--line);
  }
  .dot.done{background:var(--ink-dim);}
  .dot.current{background:var(--blue);}
  .counter{
    font-size:clamp(13px,1.6vw,20px);
    color:var(--ink-dim);
    white-space:nowrap;
  }

  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    overflow-y:auto;
  }
  .card{
    width:100%;
    max-width:1200px;
    text-align:center;
    margin:auto;
  }

  .turn-badge{
    display:inline-block;
    font-size:clamp(22px,3.2vw,38px);
    font-weight:bold;
    border-radius:999px;
    padding:10px 34px;
    margin-bottom:clamp(18px,2.8vh,32px);
  }
  .turn-badge.a{color:var(--blue); border:3px solid var(--blue); background:rgba(79,168,232,0.12);}
  .turn-badge.b{color:var(--purple); border:3px solid var(--purple); background:rgba(185,139,232,0.14);}

  .timer-wrap{
    margin:0 0 clamp(16px,2.5vh,28px) 0;
  }
  .timer-label{
    font-size:clamp(14px,1.6vw,20px);
    color:var(--ink-dim);
    margin-bottom:4px;
  }
  .timer-value{
    font-size:clamp(40px,6vw,72px);
    font-weight:bold;
    color:var(--blue);
    font-variant-numeric:tabular-nums;
    transition:color .2s ease;
  }
  .timer-value.urgent{color:var(--coral);}
  .timer-bar-track{
    width:min(420px,80%);
    height:10px;
    background:var(--line);
    border-radius:6px;
    margin:10px auto 0;
    overflow:hidden;
  }
  .timer-bar-fill{
    height:100%;
    background:var(--blue);
    width:100%;
    transition:width 1s linear, background .3s ease;
  }
  .timer-bar-fill.urgent{background:var(--coral);}

  .prompt{
    font-size:clamp(30px,5vw,64px);
    font-weight:bold;
    line-height:1.25;
    margin:0 0 clamp(20px,3vh,40px) 0;
  }
  .prompt em{
    font-style:normal;
    color:var(--yellow);
    text-decoration:underline;
    text-decoration-style:wavy;
    text-decoration-color:var(--blue);
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(14px,2vw,26px);
    max-width:900px;
    margin:0 auto;
  }
  .opt{
    font-size:clamp(22px,2.6vw,34px);
    background:var(--card);
    border:3px solid var(--line);
    border-radius:18px;
    padding:clamp(14px,2vh,26px) clamp(16px,2vw,28px);
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    font-family:inherit;
  }
  .opt:hover{border-color:var(--blue); transform:translateY(-2px);}
  .opt.selected{border-color:var(--blue); background:var(--line-soft);}
  .opt.correct{background:var(--opt-bg-correct); border-color:var(--green); color:var(--ink); transform:scale(1.04);}
  .opt.wrong{background:var(--opt-bg-wrong); border-color:var(--coral); opacity:0.7;}
  .opt:disabled{cursor:default;}

  .reveal-btn{
    margin-top:clamp(22px,3.5vh,40px);
    font-size:clamp(22px,2.6vw,32px);
    background:var(--blue);
    color:#062338;
    border:none;
    border-radius:14px;
    padding:16px 46px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
  }
  .reveal-btn:hover{background:#69B9EE;}

  .answer-banner{margin-top:clamp(20px,3vh,34px); min-height:1.5em;}
  .answer-banner .label{font-size:clamp(18px,2.2vw,26px); color:var(--ink-dim); margin-bottom:6px;}
  .answer-banner .value{font-size:clamp(40px,7vw,84px); font-weight:bold; color:var(--yellow); line-height:1.15;}
  .answer-banner .verdict{font-size:clamp(22px,3.2vw,34px); font-weight:bold; margin-top:10px;}
  .answer-banner .verdict.right{color:var(--green);}
  .answer-banner .verdict.wrong{color:var(--coral);}
  .answer-banner .phrase{font-size:clamp(24px,3.4vw,40px); font-weight:bold; color:var(--blue); margin-top:calc(14px + env(safe-area-inset-top,0px));}

  .divider-eyebrow{
    display:inline-block;
    font-size:clamp(18px,2.4vw,28px);
    font-weight:bold;
    letter-spacing:0.04em;
    color:var(--blue);
    border:2px solid var(--blue);
    border-radius:999px;
    padding:8px 26px;
    margin-bottom:clamp(16px,2.6vh,28px);
  }
  .divider-title{font-size:clamp(40px,7vw,92px); font-weight:bold; color:var(--ink); margin-bottom:14px;}
  .divider-sub{font-size:clamp(20px,3vw,32px); color:var(--ink-dim);}

  .title-main{font-size:clamp(56px,10vw,140px); font-weight:bold; margin-bottom:14px; color:var(--ink);}
  .title-sub{font-size:clamp(26px,4vw,48px); color:var(--blue); margin-bottom:14px;}
  .title-note{font-size:clamp(20px,3vw,32px); color:var(--ink-dim); max-width:900px; margin:0 auto;}

  .mode-title{font-size:clamp(34px,5.5vw,64px); font-weight:bold; margin-bottom:clamp(24px,4vh,50px);}
  .mode-options{display:flex; gap:24px; justify-content:center; flex-wrap:wrap;}
  .mode-btn{
    font-size:clamp(22px,2.8vw,34px);
    font-weight:bold;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:20px;
    padding:clamp(24px,3.5vh,40px) clamp(30px,4vw,54px);
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    min-width:280px;
  }
  .mode-btn:hover{border-color:var(--blue); transform:translateY(-2px);}
  .mode-btn .sub{display:block; font-size:0.55em; color:var(--ink-dim); font-weight:normal; margin-top:8px;}

  .goodluck-text{
    font-size:clamp(64px,13vw,170px);
    font-weight:bold;
    color:var(--yellow);
    margin-bottom:clamp(14px,2.5vh,28px);
  }
  .goodluck-note{
    font-size:clamp(20px,3vw,32px);
    color:var(--ink-dim);
  }

  .group-score-title{font-size:clamp(26px,3.6vw,44px); color:var(--ink-dim); margin-bottom:14px;}
  .group-score-value{font-size:clamp(56px,9vw,110px); font-weight:bold; color:var(--yellow); margin-bottom:14px;}
  .group-score-pct{font-size:clamp(22px,3vw,32px); color:var(--blue);}
  .team-score-row{display:flex; gap:clamp(20px,4vw,60px); justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .team-score-col .name{font-size:clamp(20px,2.6vw,28px); font-weight:bold;}
  .team-score-col.a .name{color:var(--blue);}
  .team-score-col.b .name{color:var(--purple);}
  .team-score-col .val{font-size:clamp(40px,6vw,66px); font-weight:bold; color:var(--yellow);}

  .summary-heading{
    font-size:clamp(28px,4vw,46px);
    font-weight:bold;
    color:var(--blue);
    margin-bottom:clamp(18px,2.6vh,30px);
    text-align:center;
  }
  .summary-choice{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:clamp(16px,2.4vh,26px);
  }
  .summary-btn{
    font-size:clamp(20px,2.4vw,28px);
    font-weight:bold;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:16px;
    padding:16px 36px;
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .summary-btn:hover{border-color:var(--blue);}
  .summary-list{
    list-style:none;
    padding:0;
    margin:clamp(10px,2vh,20px) auto 0;
    max-width:900px;
    text-align:left;
  }
  .summary-block{
    margin-bottom:clamp(18px,2.6vh,28px);
  }
  .summary-block .rule-title{
    font-size:clamp(21px,2.5vw,29px);
    font-weight:bold;
    color:var(--yellow);
    margin-bottom:4px;
  }
  .summary-block .rule-text{
    font-size:clamp(19px,2.3vw,26px);
    line-height:1.5;
    color:var(--ink);
  }
  .summary-block .rule-text em{
    font-style:normal;
    color:var(--blue);
    font-weight:bold;
  }
  .rule-table{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:8px 22px;
    margin-top:12px;
  }
  .rule-table .subj{
    font-size:clamp(19px,2.2vw,26px);
    color:var(--ink-dim);
  }
  .rule-table .form{
    font-size:clamp(19px,2.2vw,26px);
    color:var(--ink);
    font-weight:bold;
  }
  .example-list{
    margin-top:10px;
  }
  .example-list .example-line{
    font-size:clamp(19px,2.3vw,26px);
    color:var(--blue);
    font-weight:bold;
    line-height:1.6;
  }

  .final-total-label{font-size:clamp(22px,3vw,30px); color:var(--ink-dim); margin-bottom:6px;}
  .final-total-value{font-size:clamp(64px,11vw,130px); font-weight:bold; color:var(--yellow); line-height:1; margin-bottom:10px;}
  .final-message{font-size:clamp(22px,3.2vw,36px); color:var(--blue); font-weight:bold; margin:14px auto clamp(20px,3.5vh,40px); max-width:900px; line-height:1.35;}
  .breakdown{max-width:820px; margin:0 auto; text-align:left;}
  .breakdown-row{display:flex; justify-content:space-between; align-items:center; font-size:clamp(18px,2.4vw,26px); padding:10px 4px; border-bottom:1px solid var(--line);}
  .breakdown-row .name{color:var(--ink);}
  .breakdown-row .score{color:var(--yellow); font-weight:bold;}

  .nav{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:clamp(10px,2vh,24px);
  }
  .navbtn{
    font-size:clamp(16px,2vw,24px);
    background:transparent;
    color:var(--ink);
    border:2px solid var(--line);
    border-radius:12px;
    padding:10px 28px;
    cursor:pointer;
    font-family:inherit;
  }
  .navbtn:hover{border-color:var(--blue);}
  .navbtn:disabled{opacity:0.3; cursor:default;}
  .hint{font-size:clamp(13px,1.5vw,18px); color:var(--ink-dim);}

  .theme-toggle{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    right:14px;
    z-index:50;
    font-size:clamp(13px,1.5vw,18px);
    font-weight:bold;
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--line);
    border-radius:999px;
    padding:8px 20px;
    cursor:pointer;
    font-family:inherit;
  }
  .theme-toggle:hover{border-color:var(--blue);}

  .jump-select{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:14px;
    z-index:50;
    font-size:clamp(13px,1.5vw,18px);
    font-weight:bold;
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    font-family:inherit;
    max-width:44vw;
  }
  .jump-select:hover{border-color:var(--blue);}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle">☀ Light mode</button>
<select class="jump-select" id="jumpSelect"></select>

<div class="wrap">
  <div class="topbar" id="topbar">
    <div class="section-tag" id="sectionTag">Intro</div>
    <div class="progress" id="progress"></div>
    <div class="score-chips" id="scoreChips"></div>
    <div class="counter" id="counter">0 / 0</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="nav">
    <button class="navbtn" id="prevBtn">&larr; Previous</button>
    <div class="hint" id="hint">Use the arrow keys or click the buttons</div>
    <button class="navbtn" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<script>

  document.documentElement.setAttribute("data-theme", theme);

let current = 0;

const jumpSelect = document.getElementById("jumpSelect");
function buildJumpMenu(){
  const targets = [{label:"Start", index:0}];
  slides.forEach((s, i) => {
    if(s.type === "divider") targets.push({label:s.section + ": " + s.title, index:i});
    if(s.type === "summary" && s.first) targets.push({label:s.section + ": explanation", index:i});
    if(s.type === "sessionbreak") targets.push({label:"Session 2 (start)", index:i});
    if(s.type === "end") targets.push({label:"Final results", index:i});
  });
  jumpSelect.innerHTML = targets.map(t => `<option value="${t.index}">Jump to: ${t.label}</option>`).join("");
}
buildJumpMenu();
jumpSelect.addEventListener("change", () => {
  current = parseInt(jumpSelect.value);
  render();
});
function syncJumpSelect(){
  const options = Array.from(jumpSelect.options).map(o => parseInt(o.value));
  let best = options[0];
  options.forEach(v => { if(v <= current) best = v; });
  jumpSelect.value = best;
}
let timerInterval = null;
const QUESTION_SECONDS = 75;

const stage = document.getElementById("stage");
const topbar = document.getElementById("topbar");

const questionSlides = slides.filter(s => s.type === "mc");

function buildProgress(){
  progress.innerHTML = "";
  questionSlides.forEach(() => {
    const d = document.createElement("div");
    d.className = "dot";
    progress.appendChild(d);
  });
}
buildProgress();

function assignTeams(){
  teamOwner = {};
  let turn = "A";
  slides.forEach((s, i) => {
    if(s.type === "mc"){
      teamOwner[i] = turn;
      turn = (turn === "A") ? "B" : "A";
    }
  });
}

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function startTimer(onExpire){
  let timeLeft = QUESTION_SECONDS;
  const valueEl = document.getElementById("timerValue");
  const fillEl = document.getElementById("timerBarFill");
  function paint(){
    if(!valueEl) return;
    valueEl.textContent = formatTime(timeLeft);
    const pct = Math.max(0, (timeLeft / QUESTION_SECONDS) * 100);
    if(fillEl) fillEl.style.width = pct + "%";
    if(timeLeft <= 10){
      valueEl.classList.add("urgent");
      if(fillEl) fillEl.classList.add("urgent");
    }
  }
  paint();
  timerInterval = setInterval(() => {
    timeLeft--;
    paint();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      onExpire();
    }
  }, 1000);
}

function groupInfo(gid){ return groups.find(g => g.id === gid); }

function groupScore(gid){
  let earned = 0;
  slides.forEach((s, i) => { if(s.group === gid && scoreState[i] !== undefined) earned += scoreState[i]; });
  return earned;
}
function totalScore(){
  let earned = 0;
  Object.keys(scoreState).forEach(i => { earned += scoreState[i]; });
  return earned;
}
function teamEarned(team, gid){
  let earned = 0;
  slides.forEach((s, i) => {
    if(s.type === "mc" && teamOwner[i] === team && (!gid || s.group === gid) && scoreState[i] !== undefined) earned += scoreState[i];
  });
  return earned;
}
function teamMax(team, gid){
  let max = 0;
  slides.forEach((s, i) => {
    if(s.type === "mc" && teamOwner[i] === team && (!gid || s.group === gid)) max += s.points;
  });
  return max;
}

function renderScoreChips(){
  scoreChips.innerHTML = "";
  if(mode === "team"){
    const a = document.createElement("div");
    a.className = "score-chip a";
    a.textContent = "Team A: " + teamEarned("A");
    const b = document.createElement("div");
    b.className = "score-chip b";
    b.textContent = "Team B: " + teamEarned("B");
    scoreChips.appendChild(a);
    scoreChips.appendChild(b);
  } else if(mode === "individual"){
    const s = document.createElement("div");
    s.className = "score-chip solo";
    s.textContent = "Score: " + totalScore() + " / 100";
    scoreChips.appendChild(s);
  }
}

function render(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  const s = slides[current];
  stage.innerHTML = "";

  if(s.type === "title"){
    topbar.style.visibility = "hidden";
    hint.textContent = "Use the arrow keys or click the buttons";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="title-main">${s.main}</div>
      <div class="title-sub">${s.sub}</div>
      <div class="title-note">${s.note}</div>`;
    stage.appendChild(div);
    nextBtn.disabled = false;

  } else if(s.type === "mode"){
    topbar.style.visibility = "hidden";
    hint.textContent = "Choose how the class will play";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="mode-title">How do you want to play?</div>
      <div class="mode-options">
        <button class="mode-btn" id="soloBtn">Play individually<span class="sub">One shared score</span></button>
        <button class="mode-btn" id="teamBtn">Play in teams<span class="sub">Team A vs Team B, alternating turns</span></button>
      </div>`;
    stage.appendChild(div);
    document.getElementById("soloBtn").addEventListener("click", () => {
      mode = "individual";
      current++;
      render();
    });
    document.getElementById("teamBtn").addEventListener("click", () => {
      mode = "team";
      assignTeams();
      current++;
      render();
    });
    nextBtn.disabled = true;

  } else if(s.type === "goodluck"){

      scoreHtml = `<div class="team-score-row">
        <div class="team-score-col a"><div class="name">Team A</div><div class="val">${teamEarned("A")} pts</div></div>
        <div class="team-score-col b"><div class="name">Team B</div><div class="val">${teamEarned("B")} pts</div></div>
      </div>`;
    } else {
      scoreHtml = `<div class="final-total-value">${totalScore()} pts so far</div>`;
    }
    div.innerHTML = `
      <div class="divider-title">End of Session 1</div>
      <div class="divider-sub">Session 2 starts here. See you next lesson!</div>
      ${scoreHtml}`;
    stage.appendChild(div);
    nextBtn.disabled = false;

  } else if(s.type === "end"){
    topbar.style.visibility = "hidden";
    hint.textContent = "Use the arrow keys or click the buttons";
    const div = document.createElement("div");
    div.className = "card";

    if(mode === "team"){
      const earnedA = teamEarned("A"), maxA = teamMax("A");
      const earnedB = teamEarned("B"), maxB = teamMax("B");
      const pctA = maxA ? Math.round((earnedA / maxA) * 100) : 0;
      const pctB = maxB ? Math.round((earnedB / maxB) * 100) : 0;
      let winner;
      if(pctA > pctB) winner = "Team A wins! Well done, everyone!";
      else if(pctB > pctA) winner = "Team B wins! Well done, everyone!";
      else winner = "It's a tie! Well done, everyone!";

      const rows = groups.map(g => {
        const a = teamEarned("A", g.id), maxGA = teamMax("A", g.id);
        const b = teamEarned("B", g.id), maxGB = teamMax("B", g.id);
        return `<div class="breakdown-row"><span class="name">${g.label}</span><span class="score">A: ${a}/${maxGA} &nbsp; B: ${b}/${maxGB}</span></div>`;
      }).join("");

      div.innerHTML = `
        <div class="final-total-label">Final result</div>
        <div class="team-score-row">
          <div class="team-score-col a"><div class="name">Team A</div><div class="val">${pctA}%</div></div>
          <div class="team-score-col b"><div class="name">Team B</div><div class="val">${pctB}%</div></div>
        </div>
        <div class="final-message">${winner}</div>
        <div class="breakdown">${rows}</div>`;
    } else {
      const total = totalScore();
      const pct = Math.round(total);
      let message;
      if(pct >= 90) message = "Amazing! You know this very well!";
      else if(pct >= 75) message = "Great job! You know your prepositions!";
      else if(pct >= 50) message = "Good work! Keep practising!";
      else if(pct >= 25) message = "Keep trying! You are learning!";
      else message = "Good effort! Let's practise more together!";

      const rows = groups.map(g => {
        const earned = groupScore(g.id);
        return `<div class="breakdown-row"><span class="name">${g.label}</span><span class="score">${earned} / ${g.points}</span></div>`;
      }).join("");

      div.innerHTML = `
        <div class="final-total-label">Final score</div>
        <div class="final-total-value">${pct}%</div>
        <div class="final-message">${message}</div>
        <div class="breakdown">${rows}</div>`;
    }
    stage.appendChild(div);
    nextBtn.disabled = false;

  } else if(s.type === "divider"){
    topbar.style.visibility = "visible";
    updateTopbar(s);
    hint.textContent = "Use the arrow keys or click the buttons";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="divider-eyebrow">${s.section}</div>
      <div class="divider-title">${s.title}</div>
      <div class="divider-sub">${s.sub}</div>`;
    stage.appendChild(div);
    nextBtn.disabled = false;

  } else if(s.type === "summary"){
    topbar.style.visibility = "visible";
    updateTopbar(s);
    hint.textContent = "The teacher or the class decides whether to see the explanation";
    const div = document.createElement("div");
    div.className = "card";
    stage.appendChild(div);

    function renderContent(){
      const blocks = s.explain.map(b => {
        const tableHtml = b.table
          ? '<div class="rule-table">' + b.table.map(row =>
              '<div class="subj">' + row[0] + '</div><div class="form">' + row[1] + '</div>'
            ).join("") + '</div>'
          : "";
        const examplesHtml = b.examples
          ? '<div class="example-list">' + b.examples.map(ex =>
              '<div class="example-line">' + ex + '</div>'
            ).join("") + '</div>'
          : "";
        return '<div class="summary-block"><div class="rule-title">' + b.title + '</div><div class="rule-text">' + b.text + '</div>' + tableHtml + examplesHtml + '</div>';
      }).join("");
      const treeHtml = s.svg ? '<div class="svg-wrap">' + s.svg + '</div>' : "";
      div.innerHTML = treeHtml + '<div class="summary-list">' + blocks + '</div>';
    }

    if(explainShown[s.clusterId]){
      renderContent();
    } else if(s.first){
      div.innerHTML = `
        <div class="summary-heading">Would you like the material explained?</div>
        <div class="summary-choice">
          <button class="summary-btn" id="showSummaryBtn">Show explanation</button>
          <button class="summary-btn" id="skipSummaryBtn">Skip</button>
        </div>`;
      div.querySelector("#showSummaryBtn").addEventListener("click", () => {
        explainShown[s.clusterId] = true;
        renderContent();
      });
      div.querySelector("#skipSummaryBtn").addEventListener("click", () => {
        let count = 0;
        for(let i = current; i < slides.length && slides[i].clusterId === s.clusterId; i++) count++;
        current += count;
        render();
      });
    } else {
      current++;
      render();
      return;
    }

    nextBtn.disabled = false;

  } else if(s.type === "groupresult"){
    topbar.style.visibility = "visible";
    updateTopbar(s);
    hint.textContent = "Use the arrow keys or click the buttons";
    const g = groupInfo(s.group);
    const div = document.createElement("div");
    div.className = "card";

    if(mode === "team"){
      const a = teamEarned("A", g.id), maxA = teamMax("A", g.id);
      const b = teamEarned("B", g.id), maxB = teamMax("B", g.id);
      div.innerHTML = `
        <div class="group-score-title">${g.label}: team scores</div>
        <div class="team-score-row">
          <div class="team-score-col a"><div class="name">Team A</div><div class="val">${a} / ${maxA}</div></div>
          <div class="team-score-col b"><div class="name">Team B</div><div class="val">${b} / ${maxB}</div></div>
        </div>`;
    } else {
      const earned = groupScore(s.group);
      const pct = Math.round((earned / g.points) * 100);
      div.innerHTML = `
        <div class="group-score-title">${g.label}: group score</div>
        <div class="group-score-value">${earned} / ${g.points}</div>
        <div class="group-score-pct">${pct}% of this part</div>`;
    }
    stage.appendChild(div);
    nextBtn.disabled = false;

  } else if(s.type === "mc"){
    topbar.style.visibility = "visible";
    updateTopbar(s);
    hint.textContent = "Click an option to reveal the answer instantly";
    const div = document.createElement("div");
    div.className = "card";

    const alreadyScored = scoreState[current] !== undefined;
    const owner = teamOwner[current];
    const turnHtml = (mode === "team")
      ? `<div class="turn-badge ${owner === "A" ? "a" : "b"}">Team ${owner}'s turn</div>`
      : "";
    const timerHtml = alreadyScored ? "" : `
      <div class="timer-wrap">
        <div class="timer-label">Time left</div>
        <div class="timer-value" id="timerValue">1:15</div>
        <div class="timer-bar-track"><div class="timer-bar-fill" id="timerBarFill"></div></div>
      </div>`;
    const optsHtml = s.options.map((opt, i) =>
      `<button class="opt" data-i="${i}">${opt}</button>`
    ).join("");

    div.innerHTML = `
      ${turnHtml}
      ${timerHtml}
      ${s.pic ? `<div class="pic-row"><div class="q-pic">${s.pic}</div><div class="pic-main"><div class="prompt">${s.prompt}</div><div class="options">${optsHtml}</div></div></div>` : `<div class="prompt">${s.prompt}</div><div class="options">${optsHtml}</div>`}
      <div class="answer-banner" id="answerBanner"></div>`;
    stage.appendChild(div);

    const btns = div.querySelectorAll(".opt");
    let selected = selectedState[current] !== undefined ? selectedState[current] : null;

    function finalize(chosenIndex){
      if(chosenIndex !== null && chosenIndex !== undefined){
        selected = chosenIndex;
        selectedState[current] = selected;
      }
      const timerWrap = div.querySelector(".timer-wrap");
      if(timerWrap) timerWrap.style.display = "none";
      btns.forEach((x, i) => {
        x.disabled = true;
        if(i === s.correct) x.classList.add("correct");
        else if(i === selected) x.classList.add("wrong");
      });
      const isCorrect = selected === s.correct;
      if(scoreState[current] === undefined){
        scoreState[current] = isCorrect ? s.points : 0;
      }
      const verdictHtml = isCorrect
        ? '<div class="verdict right">Correct! +' + s.points + ' points</div>'
        : '<div class="verdict wrong">Incorrect: 0 points</div>';
      const phrase = isCorrect ? randomPhrase(CORRECT_PHRASES) : randomPhrase(INCORRECT_PHRASES);
      document.getElementById("answerBanner").innerHTML =
        '<div class="label">Correct answer</div><div class="value">' + s.options[s.correct] + '</div>' +
        verdictHtml + '<div class="phrase">' + phrase + '</div>';
      renderScoreChips();
    }

    btns.forEach(b => {
      b.addEventListener("click", () => {
        if(b.disabled) return;
        finalize(parseInt(b.dataset.i));
      });
    });

    if(alreadyScored){ finalize(selected); }
    else{ startTimer(() => finalize(selected)); }
  }

  renderScoreChips();
  syncJumpSelect();
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === slides.length - 1 ? "Restart" : "Next \u2192";
}

function updateTopbar(s){
  sectionTag.textContent = s.section || "Results";
  const idx = questionSlides.indexOf(s);
  if(idx >= 0){
    counter.textContent = (idx + 1) + " / " + questionSlides.length;
  } else {
    counter.textContent = questionSlides.length + " / " + questionSlides.length;
  }
  const dots = progress.querySelectorAll(".dot");
  dots.forEach((d, i) => {
    d.classList.remove("done","current");
    if(i < idx) d.classList.add("done");
    if(i === idx) d.classList.add("current");
  });
}

prevBtn.addEventListener("click", () => {
  if(current > 0){ current--; render(); }
});
nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < slides.length - 1){ current++; }
  else {
    current = 0;
    mode = null;
    teamOwner = {};
    for(const k in scoreState){ delete scoreState[k]; }
    for(const k in selectedState){ delete selectedState[k]; }
  }
  render();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowRight"){ nextBtn.click(); }
  if(e.key === "ArrowLeft"){ prevBtn.click(); }
});

render();
</script>
</body>
</html>
